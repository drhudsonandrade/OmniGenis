name: Genome runtime scaffold

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Scaffold change classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validation_required: ${{ steps.scope.outputs.validation_required }}
      container_required: ${{ steps.scope.outputs.container_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify Markdown-only changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              BASE_SHA="$PR_BASE_SHA"
              HEAD_SHA="$PR_HEAD_SHA"
              ;;
            push)
              BASE_SHA="$PUSH_BASE_SHA"
              HEAD_SHA="$CURRENT_SHA"
              ;;
            *)
              echo "validation_required=true" >> "$GITHUB_OUTPUT"
              echo "container_required=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          changed_paths="$RUNNER_TEMP/scaffold-changed-paths.zlist"
          deleted_paths="$RUNNER_TEMP/scaffold-deleted-paths.zlist"
          if [ "$EVENT_NAME" = "push" ]; then
            bash scripts/ci_changed_paths.sh "$BASE_SHA" "$HEAD_SHA" "$changed_paths" "$deleted_paths"
          else
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
            git diff --no-renames --diff-filter=D --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$deleted_paths"
            while IFS= read -r -d '' changed_path; do
              case "$changed_path" in
                scripts/ci_changed_paths.sh|scripts/ci_change_classifier.py|.github/workflows/scaffold-validation.yml)
                  echo "validation_required=true" >> "$GITHUB_OUTPUT"
                  echo "container_required=true" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
            done < "$changed_paths"
          fi
          validation_required=$(python3 scripts/ci_change_classifier.py markdown --changed "$changed_paths" --deleted "$deleted_paths")
          container_required=$(python3 scripts/ci_change_classifier.py container --changed "$changed_paths")
          echo "validation_required=$validation_required" >> "$GITHUB_OUTPUT"
          echo "container_required=$container_required" >> "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.validation_required == 'true')
    runs-on: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.ref_protected) && 'omnigenis-isolated' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Require successful scope classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Scaffold scope classification failed or was cancelled.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Bootstrap attestation verification resolves its recorded provenance commit.
          # A depth-1 checkout cannot prove that an older full SHA exists as a commit.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reporting/requirements.txt
      - name: Install pinned editorial renderer dependencies
        run: python3 -m pip install --disable-pip-version-check -r reporting/requirements.txt
      - name: Validate shell and Python
        run: |
          export TMPDIR="$RUNNER_TEMP"
          bash -n scripts/*.sh tests/test_wgs_align_or_stage.sh tests/test_ci_changed_paths.sh
          python3 -m compileall -q policy_engine/genoma_policy scripts evidence_adapters
          python3 -m unittest discover -s tests -v
      - name: Exercise WGS alignment trust boundary
        run: TMPDIR="$RUNNER_TEMP" bash tests/test_wgs_align_or_stage.sh
      - name: Exercise CI changed-path push contract
        run: TMPDIR="$RUNNER_TEMP" bash tests/test_ci_changed_paths.sh
      - name: Build and test MCP
        working-directory: mcp
        run: |
          npm ci --ignore-scripts
          TMPDIR="$RUNNER_TEMP" npm test

  four-plane-audit:
    name: Four-plane audit
    needs: [changes, static]
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.validation_required == 'true' &&
      needs.static.result == 'success'
    uses: ./.github/workflows/genoma-audit.yml

  container-canary:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.container_required == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require successful scope classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Scaffold scope classification failed or was cancelled.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned tool image
        run: docker build --tag omnigenis-genome:${{ github.sha }} .
      - name: Run non-sensitive canary
        run: |
          mkdir -p ci-results
          chmod 0777 ci-results
          docker run --rm \
            --volume "$PWD/ci-results:/results" \
            omnigenis-genome:${{ github.sha }} \
            /opt/omnigenis/scripts/run_canary.sh /results/canary
      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-canary-${{ github.sha }}
          path: ci-results/canary/
          if-no-files-found: error
          retention-days: 7

  publish-ghcr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, container-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: publish
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/omnigenis-genome:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=omnigenis-genome-scaffold-v2
          cache-to: type=gha,mode=min,scope=omnigenis-genome-scaffold-v2,ignore-error=true
      - name: Record immutable image reference
        run: |
          printf 'ghcr.io/%s/omnigenis-genome@%s\n' \
            '${{ github.repository_owner }}' '${{ steps.publish.outputs.digest }}' \
            | tee ghcr-image-reference.txt
          printf '### Published image\n\n`%s`\n' \
            "$(cat ghcr-image-reference.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-image-reference-${{ github.sha }}
          path: ghcr-image-reference.txt
          if-no-files-found: error
          retention-days: 90
