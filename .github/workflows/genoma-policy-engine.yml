name: GENOMA deterministic policy engine

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'manifests/RULESET_V3.4.sha256'
      - 'normative/**'
      - 'policy_engine/**'
      - 'locks/**'
      - 'template_store/**'
      - 'scripts/validate_repo.py'
      - 'scripts/build_stage5_license_gate.py'
      - 'scripts/validate_stage5_license_gate.py'
      - 'config/software_license_policy.json'
      - 'config/software_license_gate_registry.json'
      - 'scripts/verify_supply_chain_lock.py'
      - 'scripts/materialize_ruleset.py'
      - 'scripts/sealed_ruleset.py'
      - 'scripts/ci_change_classifier.py'
      - 'scripts/run_live_post_deployment_smoke.py'
      - 'adapters/**'
      - '.github/governance/**'
      - '.github/workflows/genoma-policy-engine.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Policy change classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      policy_relevant: ${{ steps.scope.outputs.policy_relevant }}
      rego_required: ${{ steps.scope.outputs.rego_required }}
      policy_container_required: ${{ steps.scope.outputs.policy_container_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify policy-relevant pull request paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "policy_relevant=true" >> "$GITHUB_OUTPUT"
            echo "rego_required=true" >> "$GITHUB_OUTPUT"
            echo "policy_container_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$RUNNER_TEMP/policy-changed-paths.zlist"
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              scripts/ci_change_classifier.py|.github/workflows/genoma-policy-engine.yml)
                echo "policy_relevant=true" >> "$GITHUB_OUTPUT"
                echo "rego_required=true" >> "$GITHUB_OUTPUT"
                echo "policy_container_required=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done < "$changed_paths"
          policy_relevant=$(python3 scripts/ci_change_classifier.py policy --changed "$changed_paths")
          rego_required=$(python3 scripts/ci_change_classifier.py rego --changed "$changed_paths")
          policy_container_required=$(python3 scripts/ci_change_classifier.py policy-container --changed "$changed_paths")
          echo "policy_relevant=$policy_relevant" >> "$GITHUB_OUTPUT"
          echo "rego_required=$rego_required" >> "$GITHUB_OUTPUT"
          echo "policy_container_required=$policy_container_required" >> "$GITHUB_OUTPUT"

  policy:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.policy_relevant == 'true')
    name: Canonical policy + 263-rule contract
    runs-on: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.ref_protected) && 'omnigenis-isolated' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Require successful scope classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Policy scope classification failed or was cancelled.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify repository scaffold and sealed canonical contract
        run: python3 scripts/validate_repo.py
      - name: Verify immutable supply-chain lock
        run: python3 scripts/verify_supply_chain_lock.py
      - name: Materialize byte-exact canonical ruleset for this job
        run: |
          mkdir -p "$RUNNER_TEMP/genoma-normative"
          python3 scripts/materialize_ruleset.py --output-dir "$RUNNER_TEMP/genoma-normative" --evidence "$GITHUB_WORKSPACE/ruleset-materialization.json"
          echo "GENOMA_RULESET_PATH=$RUNNER_TEMP/genoma-normative/REGRAS_PROJETO_GENOMA_VIGENTE_v3.4_2026-08-17.txt" >> "$GITHUB_ENV"
          echo "GENOMA_RULESET_SHA_MANIFEST=$GITHUB_WORKSPACE/manifests/RULESET_V3.4.sha256" >> "$GITHUB_ENV"
          echo 'GENOMA_EXPECT_CANONICAL_SHA=1' >> "$GITHUB_ENV"
      - name: Unit tests against actual canonical v3.4 bytes
        working-directory: policy_engine
        run: python -m unittest discover -s tests -v
      - name: Verify canonical identity and 263-section parser contract
        working-directory: policy_engine
        run: python -m genoma_policy ruleset-check
      - name: Verify portable stdlib CLI
        run: |
          chmod +x policy_engine/scripts/genoma-policy
          policy_engine/scripts/genoma-policy ruleset-check
          python -m compileall -q policy_engine/genoma_policy scripts
      - name: Independent deterministic regression smoke
        run: policy_engine/scripts/genoma-policy smoke --output "$GITHUB_WORKSPACE/genoma-policy-smoke.json"
      - name: Compile complete rule catalog
        run: policy_engine/scripts/genoma-policy catalog --output "$GITHUB_WORKSPACE/genoma-ruleset-catalog.json"
      - name: Build portable deterministic source archive
        run: |
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf genoma-policy-engine-source.tgz policy_engine scripts/materialize_ruleset.py scripts/run_live_post_deployment_smoke.py normative/sealed adapters locks template_store/v3.0/MANIFEST.json
          sha256sum genoma-policy-engine-source.tgz > genoma-policy-engine-source.tgz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genoma-policy-verification-${{ github.sha }}
          path: |
            ruleset-materialization.json
            genoma-policy-smoke.json
            genoma-ruleset-catalog.json
            genoma-policy-engine-source.tgz
            genoma-policy-engine-source.tgz.sha256
          retention-days: 14
          if-no-files-found: error

  rego:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.rego_required == 'true')
    name: OPA/Rego parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful scope classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Policy scope classification failed or was cancelled.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.17.0
      - run: opa version
      - run: opa fmt --write policy_engine/policy/rego
      - run: opa test policy_engine/policy/rego -v

  container:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.policy_container_required == 'true')
    name: Real Docker + canonical read-only mount
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful scope classification
        if: needs.changes.result != 'success'
        run: |
          echo 'Policy scope classification failed or was cancelled.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file policy_engine/Dockerfile --tag genoma-policy-engine:${{ github.sha }} .
      - name: Materialize exact canonical ruleset
        run: |
          mkdir -p "$RUNNER_TEMP/genoma-normative"
          python3 scripts/materialize_ruleset.py --output-dir "$RUNNER_TEMP/genoma-normative"
      - name: Hardened HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          canonical="$RUNNER_TEMP/genoma-normative/REGRAS_PROJETO_GENOMA_VIGENTE_v3.4_2026-08-17.txt"
          cid=$(docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --cap-drop ALL --security-opt no-new-privileges:true -v "$canonical:/run/genoma/REGRAS_PROJETO_GENOMA_VIGENTE_v3.4_2026-08-17.txt:ro" -v "$PWD/manifests/RULESET_V3.4.sha256:/run/genoma/manifests/RULESET_V3.4.sha256:ro" -p 127.0.0.1:8787:8787 genoma-policy-engine:${{ github.sha }})
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz >/tmp/health.json && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/v1/ruleset >/tmp/ruleset.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/ruleset.json'))
          assert p['status']=='VIGENTE' and p['version']=='v3.4' and p['effective_date']=='17/08/2026'
          assert p['sha256']=='ab7a5f0ba9709e2f92a11ae4630f82ebae70385eab877ad3464fac6bd44a3580' and p['section_count']==263
          PY

  publish:
    name: Publish immutable OCI image + embedded provenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [policy, rego, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable policy image with OCI provenance and SBOM
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: policy_engine/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/genoma-policy-engine:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/genoma-policy-engine:v0.8.0
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.8.0
      - name: Verify OCI attestations
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/genoma-policy-engine@${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" --raw > genoma-policy-oci-index.json
          python - <<'PY'
          import json
          d=json.load(open('genoma-policy-oci-index.json'))
          assert d.get('manifests')
          assert any(x.get('platform',{}).get('os')=='unknown' for x in d['manifests'])
          PY
      - name: Record immutable image reference
        run: |
          printf 'ghcr.io/%s/genoma-policy-engine@%s\n' '${{ github.repository_owner }}' '${{ steps.push.outputs.digest }}' > genoma-policy-image-reference.txt
          printf '%s\n' '${{ steps.push.outputs.digest }}' > genoma-policy-image-digest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genoma-policy-image-reference-${{ github.sha }}
          path: |
            genoma-policy-image-reference.txt
            genoma-policy-image-digest.txt
            genoma-policy-oci-index.json
          retention-days: 90
          if-no-files-found: error
