name: GENOMA visual QA candidates

on:
  push:
    branches: [main]
    paths:
      - 'reporting/**'
      - 'normative/**'
      - 'template_store/**'
      - 'scripts/build_report_coordinate_pack.py'
      - 'scripts/pdfium_backend.py'
      - 'scripts/run_pdfium_static_pixel_qa.py'
      - 'docs/evidence/PDFIUM_COORDINATE_MIGRATION_2026-09-17.json'
      - 'docs/evidence/PDFIUM_STATIC_PIXEL_QA_200DPI_2026-09-17.json'
      - 'scripts/install_report_templates.py'
      - 'scripts/verify_template_store.py'
      - 'tests/test_editorial_renderers.py'
      - 'tests/test_template_v3_contract.py'
      - 'tests/ruleset_test_support.py'
      - 'docs/evidence/EDITORIAL_V3_STATIC_PIXEL_QA_200DPI_2026-08-16.json'
      - '.github/workflows/genoma-visual-qa-candidates.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'reporting/**'
      - 'normative/**'
      - 'template_store/**'
      - 'scripts/build_report_coordinate_pack.py'
      - 'scripts/pdfium_backend.py'
      - 'scripts/run_pdfium_static_pixel_qa.py'
      - 'docs/evidence/PDFIUM_COORDINATE_MIGRATION_2026-09-17.json'
      - 'docs/evidence/PDFIUM_STATIC_PIXEL_QA_200DPI_2026-09-17.json'
      - 'scripts/install_report_templates.py'
      - 'scripts/verify_template_store.py'
      - 'tests/test_editorial_renderers.py'
      - 'tests/test_template_v3_contract.py'
      - 'tests/ruleset_test_support.py'
      - 'docs/evidence/EDITORIAL_V3_STATIC_PIXEL_QA_200DPI_2026-08-16.json'
      - '.github/workflows/genoma-visual-qa-candidates.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  render-candidates:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned renderer dependencies
        run: pip install -r reporting/requirements.txt
      - name: Validate pinned v3 reference identities and static pixel QA evidence
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          index=json.loads(Path('reporting/reference_v3_manifest.json').read_text())
          legacy_qa=json.loads(Path('docs/evidence/EDITORIAL_V3_STATIC_PIXEL_QA_200DPI_2026-08-16.json').read_text())
          migration=json.loads(Path('docs/evidence/PDFIUM_COORDINATE_MIGRATION_2026-09-17.json').read_text())
          pdfium_qa_path=Path('docs/evidence/PDFIUM_STATIC_PIXEL_QA_200DPI_2026-09-17.json')
          pdfium_qa_raw=pdfium_qa_path.read_bytes()
          pdfium_qa=json.loads(pdfium_qa_raw)
          assert set(index['reports']) == {f'{i:02d}' for i in range(1,12)}
          assert index['coordinate_compiler']['id'] == 'pypdfium2-5.13.0-pdfium-genoma-v3'
          assert index['coordinate_compiler']['backend'] == 'PDFium'
          assert index['coordinate_compiler']['pypdfium2'] == '5.13.0'
          assert migration['status'] == 'VERIFIED'
          assert migration['candidate_coordinate_artifacts']['manifest_sha256'] == index['generated_coordinate_manifest']['sha256']
          assert migration['candidate_coordinate_artifacts']['compressed_detail_sha256'] == index['generated_coordinate_detail']['sha256']
          assert migration['coordinate_equivalence']['placeholder_count_mismatches'] == 0
          assert migration['coordinate_equivalence']['background_mismatches'] == 0
          assert migration['coordinate_equivalence']['cell_bbox_mismatches'] == 0
          assert migration['pixel_qa']['pdfium_candidate_status'] == 'PASS'
          assert migration['pixel_qa']['evidence_path'] == str(pdfium_qa_path)
          assert migration['pixel_qa']['evidence_sha256'] == hashlib.sha256(pdfium_qa_raw).hexdigest()
          assert pdfium_qa['schema'] == 'omnigenis-pdfium-static-pixel-qa-v2'
          assert pdfium_qa['status'] == legacy_qa['status']
          assert pdfium_qa['aggregate']['outside_changed_pixels'] == 0
          assert pdfium_qa['aggregate']['reference_pages'] == 100
          assert pdfium_qa['aggregate']['reports'] == 11
          assert pdfium_qa['aggregate']['result'] == 'PASS'
          assert pdfium_qa['aggregate']['changed_pixels'] > 0
          producer=pdfium_qa['producer']
          producer_path=Path(producer['path'])
          assert producer_path.is_file()
          assert hashlib.sha256(producer_path.read_bytes()).hexdigest() == producer['producer_sha256']
          bundle={'provenance': producer, 'aggregate': pdfium_qa['aggregate'], 'reports': pdfium_qa['reports']}
          bundle_sha=hashlib.sha256(json.dumps(bundle,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert pdfium_qa['evidence_sha256'] == bundle_sha
          assert migration['pixel_qa']['producer_sha256'] == producer['producer_sha256']
          assert migration['pixel_qa']['provenance_bundle_sha256'] == bundle_sha
          assert pdfium_qa['coordinate_compiler']['manifest_sha256'] == index['generated_coordinate_manifest']['sha256']
          assert pdfium_qa['coordinate_compiler']['compressed_detail_sha256'] == index['generated_coordinate_detail']['sha256']
          assert legacy_qa['status'] == 'VERIFICADO'
          assert legacy_qa['aggregate'] == {'outside_changed_pixels': 0, 'reference_pages': 100, 'reports': 11, 'result': 'PASS'}
          assert legacy_qa['coordinate_compiler']['manifest_sha256'] == index['legacy_generated_coordinate_manifest']['sha256']
          assert legacy_qa['coordinate_compiler']['compressed_detail_sha256'] == index['legacy_generated_coordinate_detail']['sha256']
          for rid, meta in index['reports'].items():
              assert pdfium_qa['reports'][rid]['sha256'] == meta['sha256']
              assert pdfium_qa['reports'][rid]['pages'] == meta['page_count']
              assert pdfium_qa['reports'][rid]['qa']['outside_changed_pixels'] == 0
              assert legacy_qa['reports'][rid]['sha256'] == meta['sha256']
              assert legacy_qa['reports'][rid]['pages'] == meta['page_count']
              assert legacy_qa['coordinate_compiler']['field_counts'][rid] == meta['placeholder_count']
              assert legacy_qa['reports'][rid]['qa']['outside_changed_pixels'] == 0
          print('pinned v3 static pixel QA evidence: PASS')
          PY
      - name: Verify immutable private template store when materialized
        run: python3 scripts/verify_template_store.py --allow-sealed-only
      - name: Coordinate compiler synthetic smoke
        run: |
          python3 - <<'PY'
          import hashlib, json, tempfile
          from pathlib import Path
          from reportlab.pdfgen.canvas import Canvas
          from scripts.build_report_coordinate_pack import compile_pack, write_pack
          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              pdf=root/'fixture.pdf'
              canvas=Canvas(str(pdf),pagesize=(300,400),pageCompression=0); canvas.setFont('Helvetica',8); canvas.drawString(30,350,'[[CASE_ID]]'); canvas.save()
              index={'reports':{'01':{'filename':'fixture.pdf','sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),'size_bytes':pdf.stat().st_size,'page_count':1,'page_size_pt':[300,400],'placeholder_count':1}}}
              idx=root/'index.json'; idx.write_text(json.dumps(index))
              payload=compile_pack(root,idx)
              assert len(payload['reports']['01']['fields'])==1
              result=write_pack(payload,root/'out')
              assert result['status']=='VERIFICADO'
              assert result['reports']==1 and result['pages']==1 and result['placeholders']==1
              print('coordinate compiler synthetic smoke: PASS')
          PY
      - name: Generate all 11 programmatic fixture reports
        run: |
          mkdir -p visual-qa/candidates
          python3 - <<'PY'
          from pathlib import Path
          import normative
          from reporting.engine import render_document
          from reporting.editorial_v3 import write_editorial_bundle
          from reporting.provenance import fixture_payload

          out = Path('visual-qa/candidates')
          for i in range(1, 12):
              rid = f'{i:02d}'
              data = fixture_payload(
                  case_id='CASE-VISUAL-REFERENCE',
                  report_id=rid,
                  summary='Conteúdo rastreável para teste editorial de regressão visual.',
                  basis='Fixture editorial; não representa paciente.',
              )
              data['ruleset'] = normative.ruleset_block()
              # Patient-free visual-QA fixture only: release assembly normally supplies this
              # prerequisite, and production defaults remain fail-closed.
              data['publication_gate']['placeholders_resolved'] = True
              rendered = render_document(rid, data, mode='FINAL')
              write_editorial_bundle(
                  rendered,
                  out,
                  stem=rid,
                  programmatic_final_authorization='GitHub Actions visual-QA fixture',
              )
          PY
      - name: Structural validation
        run: |
          test "$(find visual-qa/candidates -maxdepth 1 -name '*.pdf' | wc -l)" -eq 11
          test "$(find visual-qa/candidates -maxdepth 1 -name '*.docx' | wc -l)" -eq 11
          PYTHONPATH="$PWD/tests${PYTHONPATH:+:$PYTHONPATH}" python3 -m unittest tests.test_editorial_renderers tests.test_template_v3_contract -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genoma-v3-visual-candidates-${{ github.sha }}
          path: visual-qa/candidates
          retention-days: 7
          if-no-files-found: error
