name: GENOMA NGS Runtime Resource Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'environment.yml'
      - 'Dockerfile'
      - 'main.nf'
      - 'nextflow.config'
      - 'workflows/**'
      - 'evidence_adapters/**'
      - 'scripts/__init__.py'
      - 'scripts/annotate_partial_genome.py'
      - 'scripts/build_adapter_capabilities.py'
      - 'scripts/build_array_case_manifest.py'
      - 'scripts/build_bwa_mem2_index.sh'
      - 'scripts/build_wgs_curated_manifest.py'
      - 'scripts/check_versions.sh'
      - 'scripts/code_language_guard.py'
      - 'scripts/freshness_gate.py'
      - 'scripts/generate_all_reports.py'
      - 'scripts/generate_canary.py'
      - 'scripts/latest_runtime_resource_gate.py'
      - 'scripts/materialize_ruleset.py'
      - 'scripts/prepare_latest_candidate.py'
      - 'scripts/prepare_report_release.py'
      - 'scripts/project_identity_guard.py'
      - 'scripts/governance_context_identity.py'
      - 'scripts/zero_identity_guard.py'
      - 'scripts/residual_language_audit.py'
      - 'scripts/promote_latest_candidate.py'
      - 'scripts/refresh_evidence_sources.py'
      - 'scripts/run_canary.sh'
      - 'scripts/run_snp_array.py'
      - 'scripts/runtime_resource_gate.py'
      - 'scripts/runtime_stack.py'
      - 'scripts/score_variants.py'
      - 'scripts/sealed_ruleset.py'
      - 'scripts/validate_bwa_mem2_functional.sh'
      - 'scripts/validate_grch38.sh'
      - 'scripts/verify_runtime_gate_manifest.py'
      - 'scripts/wgs_align_or_stage.sh'
      - 'scripts/wgs_consent_gate.py'
      - 'scripts/wgs_input_gate.py'
      - 'scripts/wgs_materialize_verified_input.py'
      - 'locks/**'
      - '.github/workflows/genoma-ngs-runtime-gate.yml'
      - 'normative/**'
  push:
    branches: [main]
    paths:
      - 'environment.yml'
      - 'Dockerfile'
      - 'main.nf'
      - 'nextflow.config'
      - 'workflows/**'
      - 'evidence_adapters/**'
      - 'scripts/__init__.py'
      - 'scripts/annotate_partial_genome.py'
      - 'scripts/build_adapter_capabilities.py'
      - 'scripts/build_array_case_manifest.py'
      - 'scripts/build_bwa_mem2_index.sh'
      - 'scripts/build_wgs_curated_manifest.py'
      - 'scripts/check_versions.sh'
      - 'scripts/code_language_guard.py'
      - 'scripts/freshness_gate.py'
      - 'scripts/generate_all_reports.py'
      - 'scripts/generate_canary.py'
      - 'scripts/latest_runtime_resource_gate.py'
      - 'scripts/materialize_ruleset.py'
      - 'scripts/prepare_latest_candidate.py'
      - 'scripts/prepare_report_release.py'
      - 'scripts/project_identity_guard.py'
      - 'scripts/governance_context_identity.py'
      - 'scripts/zero_identity_guard.py'
      - 'scripts/residual_language_audit.py'
      - 'scripts/promote_latest_candidate.py'
      - 'scripts/refresh_evidence_sources.py'
      - 'scripts/run_canary.sh'
      - 'scripts/run_snp_array.py'
      - 'scripts/runtime_resource_gate.py'
      - 'scripts/runtime_stack.py'
      - 'scripts/score_variants.py'
      - 'scripts/sealed_ruleset.py'
      - 'scripts/validate_bwa_mem2_functional.sh'
      - 'scripts/validate_grch38.sh'
      - 'scripts/verify_runtime_gate_manifest.py'
      - 'scripts/wgs_align_or_stage.sh'
      - 'scripts/wgs_consent_gate.py'
      - 'scripts/wgs_input_gate.py'
      - 'scripts/wgs_materialize_verified_input.py'
      - 'locks/**'
      - '.github/workflows/genoma-ngs-runtime-gate.yml'
      - 'normative/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight is hosted; full-grch38 requires a connected high-memory runner'
        required: true
        default: preflight
        type: choice
        options: [preflight, full-grch38]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'preflight')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize and verify supply chain
        run: |
          mkdir -p results/runtime-gate results/freshness results/canary results/nextflow-canary results/evidence-sources
          chmod 0777 results results/runtime-gate results/freshness results/canary results/nextflow-canary results/evidence-sources
          python3 scripts/validate_repo.py
          python3 scripts/verify_supply_chain_lock.py
      - name: Resolve latest mutually compatible candidate without mutating repository history
        run: |
          cp environment.yml results/freshness/environment.pinned.yml
          python3 scripts/prepare_latest_candidate.py --source environment.yml --output results/freshness/environment.latest-candidate.yml --evidence results/freshness/candidate-preparation.json
          cp results/freshness/environment.latest-candidate.yml environment.yml
      - name: Build exact latest-resolved candidate image
        run: |
          docker build --tag genoma-ngs-latest:${{ github.sha }} .
          docker image inspect genoma-ngs-latest:${{ github.sha }} --format '{{.Id}}' | tee results/freshness/image-id.txt
      - name: Execute direct and Nextflow functional canaries
        run: |
          docker run --rm -e CANARY_VERSION_POLICY=INVENTORY -v "$PWD/results:/workspace/results" genoma-ngs-latest:${{ github.sha }} /opt/omnigenis/scripts/run_canary.sh /workspace/results/canary
          jq -e '.status == "PASS"' results/canary/report.json >/dev/null
          docker run --rm -e CANARY_VERSION_POLICY=INVENTORY -v "$PWD/results:/workspace/results" genoma-ngs-latest:${{ github.sha }} nextflow run /opt/omnigenis/main.nf --mode canary --outdir /workspace/results/nextflow-canary -ansi-log false
          jq -e '.status == "PASS"' results/nextflow-canary/canary/report.json >/dev/null
      - name: Session-promote candidate and refresh evidence sources
        run: |
          python3 scripts/promote_latest_candidate.py --functional-canary results/canary/report.json --orchestration-canary results/nextflow-canary/canary/report.json --inventory results/canary/conda-inventory.json --output results/freshness/state-toolchain.json
          python3 scripts/refresh_evidence_sources.py --input-state results/freshness/state-toolchain.json --output-state results/freshness/state.json --snapshots-output results/evidence-sources/capability-snapshots.json
          jq -e 'length == 6 and all(.[]; .status == "VERIFICADO" and .retrieval_evidence.result_digest != null)' results/evidence-sources/capability-snapshots.json >/dev/null
          python3 scripts/freshness_gate.py --input results/freshness/state.json --output results/freshness/gate.json
          jq -e '.ready_for_dna == true and (.evidence_sources | length) == 6' results/freshness/gate.json >/dev/null
      - name: Execute current-session Runtime/Resource Gate
        run: |
          docker run --rm -v "$PWD/results:/workspace/results" genoma-ngs-latest:${{ github.sha }} python3 /opt/omnigenis/scripts/latest_runtime_resource_gate.py --freshness-gate /workspace/results/freshness/gate.json --ref-root /refs --bam /workspace/results/canary/work/CANARY.sorted.bam --output /workspace/results/runtime-gate/preflight.json
          jq -e '.checks.executables_and_versions.status == "EXECUTADO" and .ready_for_real_calling == false' results/runtime-gate/preflight.json >/dev/null
          echo 'Hosted preflight does not claim full GRCh38 readiness.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: genoma-ngs-runtime-preflight-${{ github.sha }}
          path: results/
          retention-days: 7
          if-no-files-found: error

  full-grch38:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full-grch38'
    runs-on: [self-hosted, linux, x64, genoma-production, highmem]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate host, repository and immutable supply chain
        run: |
          mkdir -p results/runtime-gate results/freshness results/canary results/nextflow-canary results/grch38 results/evidence-sources
          chmod 0777 results results/runtime-gate results/freshness results/canary results/nextflow-canary results/grch38 results/evidence-sources
          python3 scripts/validate_repo.py
          python3 scripts/verify_supply_chain_lock.py
          : "${REF_ROOT:=/srv/genoma/refs/GRCh38}"
          echo "REF_ROOT=$REF_ROOT" >> "$GITHUB_ENV"
          test -d "$REF_ROOT"
          awk '/MemTotal:/ {if ($2 < 100663296) exit 1}' /proc/meminfo
          df -Pk "$REF_ROOT" | awk 'NR==2 {if ($4 < 104857600) exit 1}'
      - name: Build and canary exact candidate before any DNA
        run: |
          cp environment.yml results/freshness/environment.pinned.yml
          python3 scripts/prepare_latest_candidate.py --source environment.yml --output results/freshness/environment.latest-candidate.yml --evidence results/freshness/candidate-preparation.json
          cp results/freshness/environment.latest-candidate.yml environment.yml
          docker build --tag genoma-ngs-latest:${{ github.sha }} .
          docker run --rm -e CANARY_VERSION_POLICY=INVENTORY -v "$PWD/results:/workspace/results" genoma-ngs-latest:${{ github.sha }} /opt/omnigenis/scripts/run_canary.sh /workspace/results/canary
          docker run --rm -e CANARY_VERSION_POLICY=INVENTORY -v "$PWD/results:/workspace/results" genoma-ngs-latest:${{ github.sha }} nextflow run /opt/omnigenis/main.nf --mode canary --outdir /workspace/results/nextflow-canary -ansi-log false
          jq -e '.status == "PASS"' results/canary/report.json >/dev/null
          jq -e '.status == "PASS"' results/nextflow-canary/canary/report.json >/dev/null
          python3 scripts/promote_latest_candidate.py --functional-canary results/canary/report.json --orchestration-canary results/nextflow-canary/canary/report.json --inventory results/canary/conda-inventory.json --output results/freshness/state-toolchain.json
          python3 scripts/refresh_evidence_sources.py --input-state results/freshness/state-toolchain.json --output-state results/freshness/state.json --snapshots-output results/evidence-sources/capability-snapshots.json
          python3 scripts/freshness_gate.py --input results/freshness/state.json --output results/freshness/gate.json
          jq -e '.ready_for_dna == true and (.evidence_sources | length) == 6' results/freshness/gate.json >/dev/null
      - name: Validate approved GRCh38 bundle and index
        run: |
          test -s "$REF_ROOT/GRCh38.lock.sha256.approved" || { echo 'NÃO DISPONÍVEL: approved GRCh38 lock missing'; exit 2; }
          docker run --rm -e REF_ROOT=/refs -e REQUIRE_BWA_INDEX=0 -v "$REF_ROOT:/refs:ro" genoma-ngs-latest:${{ github.sha }} /opt/omnigenis/scripts/validate_grch38.sh | tee results/grch38/source-validation.txt
          fasta="$REF_ROOT/Homo_sapiens_assembly38.fasta"
          if [ ! -s "${fasta}.0123" ] || [ ! -s "${fasta}.amb" ] || [ ! -s "${fasta}.ann" ] || [ ! -s "${fasta}.bwt.2bit.64" ] || [ ! -s "${fasta}.pac" ]; then
            docker run --rm -e REF_ROOT=/refs -v "$REF_ROOT:/refs" genoma-ngs-latest:${{ github.sha }} /opt/omnigenis/scripts/build_bwa_mem2_index.sh
          fi
          docker run --rm -e REF_ROOT=/refs -e REQUIRE_BWA_INDEX=1 -v "$REF_ROOT:/refs:ro" genoma-ngs-latest:${{ github.sha }} /opt/omnigenis/scripts/validate_grch38.sh | tee results/grch38/final-validation.txt
          docker run --rm -e REF_ROOT=/refs -v "$REF_ROOT:/refs:ro" genoma-ngs-latest:${{ github.sha }} /opt/omnigenis/scripts/validate_bwa_mem2_functional.sh | tee results/grch38/bwa-functional.txt
      - name: Re-run freshness and full Runtime/Resource Gate
        run: |
          python3 scripts/refresh_evidence_sources.py --input-state results/freshness/state-toolchain.json --output-state results/freshness/state-pre-runtime.json --snapshots-output results/evidence-sources/capability-snapshots-pre-runtime.json
          python3 scripts/freshness_gate.py --input results/freshness/state-pre-runtime.json --output results/freshness/gate-pre-runtime.json
          docker run --rm -e REF_ROOT=/refs -v "$REF_ROOT:/refs:ro" -v "$PWD/results:/workspace/results" genoma-ngs-latest:${{ github.sha }} python3 /opt/omnigenis/scripts/latest_runtime_resource_gate.py --freshness-gate /workspace/results/freshness/gate-pre-runtime.json --ref-root /refs --output /workspace/results/runtime-gate/full-grch38.json
          jq -e '.checks.executables_and_versions.status == "EXECUTADO" and .checks.reference_build_and_contigs.status == "EXECUTADO" and .checks.aligner_indexes.status == "EXECUTADO" and .checks.required_resources_checksums.status == "EXECUTADO"' results/runtime-gate/full-grch38.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: genoma-ngs-runtime-full-${{ github.sha }}
          path: results/
          retention-days: 90
          if-no-files-found: error
